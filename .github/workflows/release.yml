name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag; dispatch this workflow at the same tag ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release-plan:
    name: Prepare semantic release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      should-release: ${{ github.event_name == 'workflow_dispatch' || steps.release.outputs.release_created }}
      tag: ${{ github.event.inputs.tag || steps.release.outputs.tag_name }}
      sha: ${{ github.event.inputs.tag || steps.release.outputs.sha }}
    steps:
      - name: Open or update release PR and create a draft release after merge
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-macos:
    name: Sign, notarize, verify, and publish macOS
    needs: release-plan
    if: needs.release-plan.outputs.should-release == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.tag }}
      EXPECTED_APPLE_TEAM_ID: 49K92AGPFW
    steps:
      - name: Check out the tagged release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.2
          cache: npm
      - name: Require an existing draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release verify --help >/dev/null
          test "$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" = "true"
          git fetch origin main --no-tags
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release view "$RELEASE_TAG" --json isImmutable >/dev/null
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor HEAD origin/main
          if [[ "$GITHUB_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "Attestation source mismatch: dispatch the workflow with --ref $RELEASE_TAG" >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source and semantic version
        run: |
          npm run verify
          npm run release:verify-version -- "$RELEASE_TAG"
      - name: Import Developer ID certificate and App Store Connect key
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_KEY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/worktree-manager.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey_${API_KEY_ID}.p8"
          keychain_password="$(openssl rand -hex 24)"

          test -n "$CERTIFICATE_P12_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$API_KEY_P8"
          test -n "$API_KEY_ID"
          test -n "$API_KEY_ISSUER"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$API_KEY_P8" > "$api_key_path"
          chmod 600 "$certificate_path" "$api_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          identity="$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -1)"
          test -n "$identity"
          [[ "$identity" == *"($EXPECTED_APPLE_TEAM_ID)" ]]

          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "RELEASE_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "RELEASE_CERTIFICATE=$certificate_path" >> "$GITHUB_ENV"
          echo "RELEASE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$api_key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$API_KEY_ISSUER" >> "$GITHUB_ENV"
      - name: Build, sign, notarize, staple, and smoke-test release assets
        run: npm run dist:release
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/SHA256SUMS
      - name: Preserve verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verified-${{ env.RELEASE_TAG }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified assets to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/SHA256SUMS
          )
          for asset in "${assets[@]}"; do test -f "$asset"; done
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          version="${RELEASE_TAG#v}"
          expected_assets=(
            "Worktree-Manager-$version-universal.dmg"
            "Worktree-Manager-$version-universal.zip"
            "Worktree-Manager-$version-universal.zip.blockmap"
            "latest-mac.yml"
            "SHA256SUMS"
          )
          diff -u \
            <(printf '%s\n' "${expected_assets[@]}" | sort) \
            <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)
      - name: Publish only after every verification gate passes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          verified=false
          for attempt in {1..24}; do
            if [[ "$(gh release view "$RELEASE_TAG" --json isImmutable --jq .isImmutable 2>/dev/null || true)" == "true" ]] && \
              gh release verify "$RELEASE_TAG" -R "$GITHUB_REPOSITORY"; then
              verified=true
              break
            fi
            if [[ "$attempt" -lt 24 ]]; then
              echo "Waiting for immutable release verification ($attempt/24)"
              sleep 5
            fi
          done
          if [[ "$verified" != "true" ]]; then
            echo "Published release did not become verifiably immutable within two minutes" >&2
            exit 1
          fi
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ "${RELEASE_KEYCHAIN:-}" == "$RUNNER_TEMP/"* && -f "$RELEASE_KEYCHAIN" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN"
          fi
          for secret_file in "${RELEASE_CERTIFICATE:-}" "${RELEASE_API_KEY:-}"; do
            if [[ "$secret_file" == "$RUNNER_TEMP/"* && -f "$secret_file" ]]; then
              rm -f -- "$secret_file"
            fi
          done
